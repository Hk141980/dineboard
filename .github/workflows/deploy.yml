name: DineBoard Automated AWS Deployment CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual 1-click deployment trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting Automated AWS Deployment..."
            cd /var/www/dineboard || exit 1
            
            echo "📦 Pulling latest code..."
            git pull origin main

            echo "🐳 Building & Restarting Production Docker Stack..."
            docker-compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "🗄️ Running Prisma Database Migrations..."
            docker-compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ DineBoard Successfully Deployed to AWS EC2!"
            docker-compose -f docker-compose.prod.yml ps
