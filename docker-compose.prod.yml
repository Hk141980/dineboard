version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dineboard-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dineboard}
      POSTGRES_USER: ${POSTGRES_USER:-dineboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dineboard_prod_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dineboard_user} -d ${POSTGRES_DB:-dineboard}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: dineboard-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dineboard-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dineboard_user}:${POSTGRES_PASSWORD:-dineboard_prod_secure_password_123}@postgres:5432/${POSTGRES_DB:-dineboard}?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: ${DOMAIN_URL:-https://dineboard.in}
      API_URL: ${DOMAIN_URL:-https://dineboard.in}/api
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background Worker (Reminders & Commission Invoices)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: dineboard-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dineboard_user}:${POSTGRES_PASSWORD:-dineboard_prod_secure_password_123}@postgres:5432/${POSTGRES_DB:-dineboard}?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Frontend
  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: dineboard-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
